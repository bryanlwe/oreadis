<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Pack Light</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green: #4a7c59;
    --green-dark: #3d6849;
    --green-bg: #f0f5f1;
    --grey: #767676;
    --rule: #e2e2e2;
    --max: 680px;
    --body: Georgia, 'Times New Roman', serif;
    --ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }

  html { font-size: 17px; }

  body {
    background: #fff;
    color: #111;
    font-family: var(--body);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  /* ── HEADER ── */
  header {
    position: sticky;
    top: 0;
    background: #fff;
    border-bottom: 1px solid var(--rule);
    z-index: 100;
  }
  .header-inner {
    max-width: var(--max);
    margin: 0 auto;
    padding: 0 24px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .site-name {
    font-family: var(--ui);
    font-weight: 700;
    font-size: 0.94rem;
    letter-spacing: 0.02em;
    color: #111;
    text-decoration: none;
  }
  nav { display: flex; gap: 24px; }
  nav a {
    font-family: var(--ui);
    font-size: 0.82rem;
    color: #555;
    text-decoration: none;
    letter-spacing: 0.01em;
  }
  nav a:hover, nav a.active { color: var(--green); }

  /* ── LAYOUT ── */
  main {
    max-width: var(--max);
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ── PAGE HEADER ── */
  /* .post-header on standalone pages adds 48px top padding to compensate
     for the missing back-button air found on post pages. */
  .post-header {
    padding: 48px 0 32px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 32px;
  }
  h1.post-title-large {
    font-size: 2.1rem;
    font-weight: normal;
    line-height: 1.22;
    letter-spacing: -0.015em;
  }

  .page-body p {
    font-size: 1rem;
    line-height: 1.75;
    color: #1a1a1a;
    margin-bottom: 18px;
  }
  .page-body p:last-child { margin-bottom: 0; }

  /* ── CONTACT FORM ── */
  .contact-form {
    margin-top: 32px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label {
    font-family: var(--ui);
    font-size: 0.72rem;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--grey);
    font-weight: 600;
  }
  .field input,
  .field textarea {
    font-family: var(--body);
    font-size: 1rem;
    line-height: 1.55;
    color: #111;
    background: #fff;
    border: 1px solid var(--rule);
    padding: 10px 12px;
    border-radius: 0;
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
  }
  .field input:focus,
  .field textarea:focus {
    outline: none;
    border-color: var(--green);
  }
  .field textarea {
    min-height: 180px;
    resize: vertical;
  }

  button.submit-btn {
    font-family: var(--ui);
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 600;
    color: #fff;
    background: var(--green);
    border: none;
    padding: 12px 22px;
    cursor: pointer;
    align-self: flex-start;
    margin-top: 8px;
  }
  button.submit-btn:hover { background: var(--green-dark); }

  /* ── FOOTER ── */
  footer {
    border-top: 1px solid var(--rule);
    margin-top: 96px;
  }
  .footer-inner {
    max-width: var(--max);
    margin: 0 auto;
    padding: 24px;
    display: flex;
    justify-content: space-between;
    font-family: var(--ui);
    font-size: 0.74rem;
    color: var(--grey);
  }
  .footer-inner a { color: var(--grey); }
  .footer-inner a:hover { color: var(--green); text-decoration: none; }

  a { color: var(--green); text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="site-name" href="index.html">Pack Light</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="browse.html">Browse</a>
      <a href="about.html">About</a>
    </nav>
  </div>
</header>

<main>
  <div class="post-header">
    <h1 class="post-title-large">Contact</h1>
  </div>

  <div class="page-body">
    <p>Questions about a route, a cost, or something I got wrong? Send a note below and I'll reply when I'm back from wherever I am.</p>

    <form class="contact-form" action="https://formsubmit.co/bryanlwe@hotmail.com" method="POST">
      <input type="hidden" name="_subject" value="Pack Light — new contact form message">
      <input type="hidden" name="_captcha" value="true">
      <input type="hidden" name="_template" value="table">
      <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">

      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required autocomplete="name">
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" required></textarea>
      </div>

      <button type="submit" class="submit-btn">Contact Us</button>
    </form>
  </div>
</main>

<footer>
  <div class="footer-inner">
    <span>© 2026 Pack Light</span>
    <span><a href="contact.html">Contact</a> · <a href="privacy.html">Privacy</a></span>
  </div>
</footer>

</body>
</html>
